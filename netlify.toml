[build]
  base = "frontend"
  command = "yarn build"
  publish = "build"

[build.environment]
  NODE_VERSION = "20"
  CI = "false"
  DISABLE_ESLINT_PLUGIN = "true"

# Single page app: send every route to index.html so refreshes and
# deep links do not 404 on Netlify.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
